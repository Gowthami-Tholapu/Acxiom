version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: acxiom_crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: acxiom_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-pcrm_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acxiom_crm_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PROJECT_NAME: "AcxiomCRM"
      VERSION: "1.0.0"
      API_V1_STR: "/api"
      SECRET_KEY: "acxiomcrm-super-secret-jwt-key-change-in-production-min-32-chars"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      MAX_FAILED_LOGIN_ATTEMPTS: "5"
      LOCKOUT_DURATION_MINUTES: "15"
      DATABASE_URL: "mysql+pymysql://crm_user:crm_password@mysql:3306/acxiom_crm"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
      COOKIE_NAME: "access_token"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acxiom_crm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
    driver: local
